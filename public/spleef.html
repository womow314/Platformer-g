            );

            if (scaffold.parent) {
                scaffold.parent.remove(scaffold);
            }

            const index = scafoldings.indexOf(scaffold);

            if (index !== -1) {
                scafoldings.splice(index, 1);

        function createNameTag(name) {
            const canvas = document.createElement("canvas");
            canvas.width = 256;
            canvas.height = 64;

            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.font = "bold 28px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            ctx.strokeStyle = "black";
            ctx.lineWidth = 5;
            ctx.fillStyle = "white";

            ctx.strokeText(name, 128, 32);
            ctx.fillText(name, 128, 32);

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;

            const material = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthTest: false
            });

            const sprite = new THREE.Sprite(material);
            sprite.scale.set(3, 0.75, 1);
            sprite.position.set(0, 2.2, 0);

            return sprite;
        }

        const spawnPlatform = (
            group,
            x,
            y,
            z,
            width = 1,
            height = 1,
            depth = 1,
            texture = grassMAT
        ) => {
            if (texture === "scafo") {
                addScafolding(x, y, z);
                return;
            }

            const p = new THREE.Mesh(
                new THREE.BoxGeometry(width, height, depth),
                texture
            );

            p.position.set(x, y, z);
            p.texture = textureNames.get(texture) || "unknown";

            p.width = width;
            p.height = height;
            p.depth = depth;
            p.crack = false;

            // IMPORTANT
            if (texture === lavalMat) {
                p.isLava = true;
                lavas.push(p);
            }

            group.add(p);
            platforms.push(p);

            platformMap.set(blockKey(x, y, z), p);

            return p;

        function bindButton(id, key) {

        let isFirstPerson = false

        // ===== LEFT CLICK MINING =====
        const raycaster = new THREE.Raycaster();
        const mineRange = 6;

        function getNearbyPlatforms(x, y, z, radius = 2) {
            const result = [];

            const minX = Math.floor(x - radius);
            const maxX = Math.floor(x + radius);
            const minY = Math.floor(y - radius);
            const maxY = Math.floor(y + radius);
            const minZ = Math.floor(z - radius);
            const maxZ = Math.floor(z + radius);

            for (let bx = minX; bx <= maxX; bx++) {
                for (let by = minY; by <= maxY; by++) {
                    for (let bz = minZ; bz <= maxZ; bz++) {
                        const block = platformMap.get(blockKey(bx, by, bz));

                        if (block) {
                            result.push(block);
                        }
                    }
                }
            }

            return result;
        }

        function removeMinedBlock(x, y, z) {
            const key = blockKey(x, y, z);
            const block = platformMap.get(key);

            if (!block) return;

            if (block.parent) {
                block.parent.remove(block);
            }

            platformMap.delete(key);

            const index = platforms.indexOf(block);
            if (index !== -1) {
                platforms.splice(index, 1);
            }

            // Remove lava from the lava collision list too
            const lavaIndex = lavas.indexOf(block);
            if (lavaIndex !== -1) {
                lavas.splice(lavaIndex, 1);
            }
        }

        window.addEventListener("mousedown", (e) => {
            if (e.button === 2) {
                return;
            }
            if (e.button !== 0) return;
            if (e.target !== renderer.domElement) return;
            if (!isFirstPerson) return;
            isTouching = true
            miningCooldown = 0


        });

        window.addEventListener("mousedown", (e) => {
            if (e.button !== 2) return;

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const hits = raycaster.intersectObjects(
                [...platforms, ...scafoldings],
                true
            );

            if (hits.length !== 0) {
                const hit = hits[0];
                const block = hit.object;

                let scaffold = scafoldings.find(s => s === block || s.getObjectById(block.id));

                if (scaffold) {
                    const distance = camera.position.distanceTo(scaffold.position);

                    if (distance < mineRange) {
                        const x = scaffold.position.x;
                        const y = scaffold.position.y;
                        const z = scaffold.position.z;

                        removeMinedScaffolding(x, y, z);

                        socket.emit("mineBlock", {
                            x: x,
                            y: y,
                            z: z
                        });
                    }

                    return;
                }

                const distance = camera.position.distanceTo(block.position);

                if (distance < mineRange) {
                    const x = block.position.x;
                    const y = block.position.y;
                    const z = block.position.z;

                    // The face that was clicked
                    const normal = hit.face.normal.clone();

                    // Convert face normal to world direction
                    normal.transformDirection(block.matrixWorld);

                    // Round because blocks are on a grid
                    const newX = x + Math.round(normal.x);
                    const newY = y + Math.round(normal.y);
                    const newZ = z + Math.round(normal.z);

                    const occupied =
                        platforms.some(p =>
                            Math.abs(p.position.x - newX) < 0.01 &&
                            Math.abs(p.position.y - newY) < 0.01 &&
                            Math.abs(p.position.z - newZ) < 0.01
                        ) ||
                        scafoldings.some(s =>
                            Math.abs(s.userData.blockX - newX) < 0.01 &&
                            Math.abs(s.userData.blockY - newY) < 0.01 &&
                            Math.abs(s.userData.blockZ - newZ) < 0.01
                        );

                    if (!occupied) {
                        const block = document.getElementById("levelSelect").value;

                        let material;
                        let textureName;

                        if (block === "1") {
                            material = platMat;
                            textureName = "brick";
                        } else if (block === "2") {
                            material = woolMAT;
                            textureName = "wool";
                        } else if (block === "3") {
                            material = lavalMat;
                            textureName = "lava";
                        } else if (block === "4") {
                            material = ironMAT;
                            textureName = "iron";
                        } else if (block === "5") {
                            material = grassMAT;
                            textureName = "grass";
                        } else if (block === "6") {
                            material = glassMAT;
                            textureName = "glass";
                        }
                        else if (block === "7") {
                            material = "scafo";
                            textureName = "scafo";
                        }

                        spawnPlatform(
                            group1,
                            newX,
                            newY,
                            newZ,
                            1,
                            1,
                            1,
                            material
                        );

                        console.log(textureName)

                        socket.emit("placeBlock", {
                            x: newX,
                            y: newY,
                            z: newZ,
                            texture: textureName
                        });
                    }

                }
            }
        });

        window.addEventListener("mouseup", (e) => {
            if (e.button !== 0) return;
            if (e.target !== renderer.domElement) return;
            if (!isFirstPerson) return;
            isTouching = false

        });

        // Receive mined blocks from other players
        socket.on("blockMined", (data) => {
            removeMinedBlock(data.x, data.y, data.z);
            removeMinedScaffolding(data.x, data.y, data.z);
        });
        socket.on("blockPlaced", (data) => {
            let material

            if (data.texture === "brick") {
                material = platMat
            } else if (data.texture === "wool") {
                material = woolMAT
            }
            else if (data.texture === "lava") {
                material = lavalMat
            }
            else if (data.texture === "iron") {
                material = ironMAT
            }
            else if (data.texture === "grass") {
                material = grassMAT
            }
            else if (data.texture === "glass") {
                material = glassMAT
            }
            else if (data.texture === "scafo") {
                material = "scafo"
            }
            console.log(data.texture)

            // Don't create a duplicate if this is our own block.
            const alreadyExists = platforms.some(p =>
                Math.abs(p.position.x - data.x) < 0.01 &&
                Math.abs(p.position.y - data.y) < 0.01 &&
                Math.abs(p.position.z - data.z) < 0.01
            );

            if (alreadyExists) return;

            spawnPlatform(
                group1,
                data.x,
                data.y,
                data.z,
                1,
                1,
                1,
                material
            );
        });


        renderer.domElement.addEventListener("click", () => {
            renderer.domElement.requestPointerLock();
            isFirstPerson = true
            player.visible = false

        });
        document.addEventListener("pointerlockchange", () => {
            if (document.pointerLockElement === renderer.domElement) {
                isFirstPerson = true;
                player.visible = false
            } else {
                isFirstPerson = false;
                player.visible = true
                cameraLookY = 0;
            }
        });
        window.addEventListener("mousemove", (e) => {
            if (document.pointerLockElement !== renderer.domElement) return;

            cameraAngle -= e.movementX * sensitivity;
            cameraLookY -= e.movementY * sensitivity;

            cameraLookY = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, cameraLookY));
        });
        let lastTouchX = null;

        window.addEventListener("touchstart", (e) => {

                lastSent.z = player.position.z;
            }

            for (const id in players3d) {

                if (id === socket.id) continue;

                const p = players3d[id];

                if (!otherPlayers[id]) {


                    let mesh;
                    if (p.it) {
                        mesh = new THREE.Mesh(playerGeo, itMat);

                    } else {
                        mesh = new THREE.Mesh(playerGeo, playerMat);

                    }


                    const tag = createNameTag(p.name);
                    mesh.userData.nameTag = tag;
                    mesh.userData.lastName = p.name;
                    mesh.add(tag);

                    scene.add(mesh);
                    otherPlayers[id] = mesh;

                }

                otherPlayers[id].position.set(
                    p.x,
                    p.y,
                    p.z
                );
                otherPlayers[id].material = playerMat;

                if (otherPlayers[id].userData.lastName !== p.name) {
                    otherPlayers[id].remove(otherPlayers[id].userData.nameTag);

                    const newTag = createNameTag(p.name);

                    otherPlayers[id].add(newTag);

                    otherPlayers[id].userData.nameTag = newTag;
                    otherPlayers[id].userData.lastName = p.name;
                }


            }

            for (const id in otherPlayers) {

                if (!players3d[id]) {
                    scene.remove(otherPlayers[id]);
                    delete otherPlayers[id];
                }

            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>

</html>

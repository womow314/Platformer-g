<!DOCTYPE html>
<html>

<head>
    <title>Halo Terrain FPS</title>
    <link rel="icon" type="image/png" href="images/halo.png">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }

        canvas {
            display: block;
        }

        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial;
            background: rgba(0, 0, 0, .5);
            padding: 10px;
        }

        #plus {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1000;
        }

        #shotHair {
            font-weight: 5px;
            font-size: 250px;
            transform: translateY(-20px)
        }

        #gunIMG {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #crossHair {
            width: 250px;
            transform: translateY(2px);
        }

        #overLay {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
        }
    </style>
    <link rel="stylesheet" href="styles1.css" />
</head>

<body>
    <button onclick="home()" id="home">Home</button>
    <img id="gunIMG" src="images/pixil-frame-0 (73).png">
    <img id="overLay" src="images/sniper_scope_overlay.png">

    <div id="info">
        WASD Move<br>
        Shift Sprint<br>
        Mouse Look<br>
        Space Jump<br>
        Q switch guns <br>
        <span style="color: red;">Kills: <span id="kills">0</span></span> <br>
        Ammo: <span id="ammoTag">160</span> <br> <br>
        Current gun: <span id="current">Assult</span>
    </div>
    <div id="progressContainer">
        <div id="progressBar"></div>
    </div>

    <span id="plus"><img id="crossHair" src="images/halo_assault_rifle_crosshair.png" alt="Crosshair"></span>


    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
        </script>
    <script>
        function home() {
            window.location.href = "index.html";
        }
    </script>

    <script type="module">
        import * as THREE from "three";
        import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

        // Put ALL of your JavaScript here.
        const gltfLoader = new GLTFLoader();
        const gunIdleA = new Image();
        gunIdleA.src = "images/pixil-frame-0 (73).png";

        const gunFireA = new Image();
        gunFireA.src = "images/pixil-frame-0 (74).png";

        const gunIdleSh = new Image();
        gunIdleSh.src = "images/pixil-frame-0 (75).png";

        const gunFireSh = new Image();
        gunFireSh.src = "images/pixil-frame-0 (76).png";

        const gunFireSn = new Image();
        gunFireSn.src = "images/sniper_rifle.png";




        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x74b0c8);

        const loader = new THREE.TextureLoader();


        let camera = new THREE.PerspectiveCamera(
            90,
            innerWidth / innerHeight,
            0.25,
            800
        );


        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.BasicShadowMap;

        document.body.appendChild(renderer.domElement);



        // LIGHT

        const sun = new THREE.DirectionalLight(
            0xffffff,
            2
        );

        sun.position.set(
            100,
            200,
            100
        );

        sun.castShadow = true;

        scene.add(sun);

        scene.add(
            new THREE.AmbientLight(
                0xffffff,
                0.3
            )
        );



        // TERRAIN HEIGHT FUNCTION
        const multiply = 5

        const m1 = Math.random() * multiply
        const m2 = Math.random() * multiply
        const m3 = Math.random() * multiply
        const m4 = Math.random() * multiply


        function getHeight(x, z) {

            return (
                Math.sin(x * .02) * 8 * m1 +
                Math.cos(z * .025) * 8 * m2 +
                Math.sin((x + z) * .01) * 15 * m3 +
                Math.sin(x * .004) * Math.cos(z * .006) * 35 * m4
            );

        }





        const waterMat = new THREE.MeshStandardMaterial({
            map: loader.load("images/pixil-frame-0 (72).png"),
            transparent: true,
            opacity: 0.5
        });

        const waterTexture = waterMat.map; // or whatever texture you use

        waterTexture.wrapS = THREE.RepeatWrapping;
        waterTexture.wrapT = THREE.RepeatWrapping;

        waterTexture.repeat.set(60, 60); // 100 tiles across X and Z

        waterTexture.needsUpdate = true;

        const platMat = [
            new THREE.MeshStandardMaterial({ map: loader.load("images/pixil-frame-0 (53).png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/pixil-frame-0 (53).png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/pixil-frame-0 (52).png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/pixil-frame-0 (52).png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/pixil-frame-0 (53).png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/pixil-frame-0 (53).png") }),
        ];
        const targetMAT = [
            new THREE.MeshStandardMaterial({ map: loader.load("images/pixil-frame-0 (71).png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/pixil-frame-0 (71).png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/pixil-frame-0 (71).png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/pixil-frame-0 (71).png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/pixil-frame-0 (71).png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/pixil-frame-0 (71).png") }),
        ];
        const ironMAT = [
            new THREE.MeshStandardMaterial({ map: loader.load("images/pixil-frame-0 (70).png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/pixil-frame-0 (70).png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/pixil-frame-0 (70).png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/pixil-frame-0 (70).png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/pixil-frame-0 (70).png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/pixil-frame-0 (70).png") }),
        ];

        const bullet = [
            new THREE.MeshStandardMaterial({ map: loader.load("images/Screen Shot 2026-05-04 at 2.50.58 PM.png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/Screen Shot 2026-05-04 at 2.50.58 PM.png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/Screen Shot 2026-05-04 at 2.50.58 PM.png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/Screen Shot 2026-05-04 at 2.50.58 PM.png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/Screen Shot 2026-05-04 at 2.50.58 PM.png") }),
            new THREE.MeshStandardMaterial({ map: loader.load("images/Screen Shot 2026-05-04 at 2.50.58 PM.png") })
        ];
        const eBulletMAT = new THREE.MeshBasicMaterial({
            color: 0x22ff22
        });
        const ammoMAT = new THREE.MeshBasicMaterial({
            color: 0x000000
        });
        let health = 100

        let platforms = []
        let bullets = []

        const spawnPlatform = (x, y, z, width = 5, height = 1, depth = 5, iron = false) => {
            let p;
            x -= 0.5 * width
            y += 1 / 2 * height
            z -= 1 / 2 * depth

            if (!iron) {
                p = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), platMat);
            } else {
                p = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), ironMAT);
            }

            p.position.set(x, y, z);

            scene.add(p);

            p.width = width;
            p.height = height;
            p.depth = depth;

            platforms.push(p);
        };
        let ammos = []
        function updateAmmo() {
            let ammoTag = document.getElementById('ammoTag')
            ammoTag.innerText = `${ammo[gun]}`
        }
        const dropAmmo = (x, z) => {
            let p;

            p = new THREE.Mesh(new THREE.BoxGeometry(5, 5, 5), ammoMAT);

            p.position.set(x, terrainHeight(x, z), z);

            scene.add(p);

            p.width = 5;
            p.height = 5;
            p.depth = 5;

            ammos.push(p);
        };

        let p1 = new THREE.Mesh(new THREE.BoxGeometry(10000, 1, 10000), waterMat);
        p1.position.set(0, -50, 0)
        scene.add(p1)

        let targets = []

        function spawnTarget(x, y, z, time = Math.random() * 1200, onPlat = false) {

            gltfLoader.load("Models/enemy.glb", function (gltf) {

                const enemy = gltf.scene;

                enemy.position.set(x, y, z);
                enemy.rotation.y = Math.PI / 2
                enemy.health = 1
                enemy.time = time
                enemy.based = onPlat
                enemy.timeToUnlock = 0

                enemy.scale.set(0.07, 0.07, 0.07); // adjust size if needed

                scene.add(enemy);

                targets.push(enemy);

            });

        }
        function spawnTree(x, z, scale) {

            gltfLoader.load("Models/tree.glb", function (gltf) {

                const tree = gltf.scene;

                const y = terrainHeight(x, z) - 3;
                if (y < -50) return;

                tree.position.set(x, y, z);
                tree.rotation.y = 1;
                tree.scale.set(scale, scale, scale);

                scene.add(tree);

                // Find the size of the model
                const box = new THREE.Box3().setFromObject(tree);
                const size = new THREE.Vector3();
                box.getSize(size);

                // Trunk collider (about 25% of tree width)
                const trunkWidth = size.x * 0.25;
                const trunkDepth = size.z * 0.25;
                const trunkHeight = size.y;

                const collider = new THREE.Mesh(
                    new THREE.BoxGeometry(trunkWidth, trunkHeight, trunkDepth),
                    new THREE.MeshBasicMaterial({
                        visible: false
                    })
                );

                collider.position.set(
                    tree.position.x,
                    tree.position.y + trunkHeight / 2,
                    tree.position.z
                );

                collider.width = trunkWidth;
                collider.height = trunkHeight;
                collider.depth = trunkDepth;

                scene.add(collider);
                treeColliders.push(collider);

            });

        }





        let inWater = false;
        const waterOverlay = new THREE.Mesh(
            new THREE.PlaneGeometry(5, 5),
            new THREE.MeshBasicMaterial({
                color: 0x0022ff,
                transparent: true,
                opacity: 0
            })
        );

        waterOverlay.position.z = -1;
        camera.add(waterOverlay);
        scene.add(camera);
        function checkWater() {

            // water surface is at y = -50
            // because your water box is 100 tall centered at -100
            const waterLevel = -50;

            if (player.y < waterLevel) {
                inWater = true;
            } else {
                inWater = false;
            }

            waterOverlay.material.opacity = inWater ? 0.15 : 0;
        }




        function playerHitsPlatform(p) {

            const withinX =
                player.x >= p.position.x - p.width / 2 - 0.5 &&
                player.x <= p.position.x + p.width / 2 + 0.5;


            const withinZ =
                player.z >= p.position.z - p.depth / 2 - 0.5 &&
                player.z <= p.position.z + p.depth / 2 + 0.5;


            const feet = player.y - player.height;


            const topOfPlatform =
                p.position.y + p.height / 2;


            const hittingTop =
                feet <= topOfPlatform &&
                feet >= topOfPlatform - 2;



            return withinX && withinZ && hittingTop;

        }

        function isInWall(p, x, z) {
            const bar = 0.6
            const withinX = x >= p.position.x - p.width / 2 - bar && x <= p.position.x + p.width / 2 + bar;

            const withinZ = z >= p.position.z - p.depth / 2 - bar && z <= p.position.z + p.depth / 2 + bar;

            const feet = player.y - player.height;
            const head = player.y;

            const withinY =
                head > p.position.y - p.height / 2 &&
                feet < p.position.y + p.height / 2;

            return withinX && withinZ && withinY;
        }

        function bulletHitsWall(p, x, y, z) {
            return (
                x >= p.position.x - p.width / 2 &&
                x <= p.position.x + p.width / 2 &&
                y >= p.position.y - p.height / 2 &&
                y <= p.position.y + p.height / 2 &&
                z >= p.position.z - p.depth / 2 &&
                z <= p.position.z + p.depth / 2
            );
        }




        // TERRAIN

        const size = 3000;
        const segments = 80; 
        let gun = "assult"


        const geo = new THREE.PlaneGeometry(
            size,
            size,
            segments,
            segments
        );


        const verts = geo.attributes.position;


        for (let i = 0; i < verts.count; i++) {

            let x = verts.getX(i);
            let z = verts.getY(i);


            verts.setZ(
                i,
                getHeight(x, z)
            );

        }



        geo.computeVertexNormals();

        const grass = new THREE.MeshStandardMaterial({
            map: loader.load("images/pixil-frame-0 (69).png")
        });
        const grassTexture = grass.map; // or whatever texture you use

        grassTexture.wrapS = THREE.RepeatWrapping;
        grassTexture.wrapT = THREE.RepeatWrapping;

        grassTexture.repeat.set(500, 500); // 100 tiles across X and Z

        grassTexture.needsUpdate = true;


        const terrain = new THREE.Mesh(
            geo,
            grass
        );


        // keep terrain aligned with collision

        terrain.rotation.x = -Math.PI / 2;

        terrain.updateMatrixWorld(true);

        scene.add(terrain);
        const raycaster = new THREE.Raycaster();
        function terrainHeight(x, z) {


            raycaster.set(
                new THREE.Vector3(x,600, z),
                new THREE.Vector3(0, -1, 0)
            );


            let hit =
                raycaster.intersectObject(
                    terrain
                );



            if (hit.length) {

                return hit[0].point.y;

            }


            return -100;

        }




        // PLAYER

        let player = {

            x: 70,

            z: -230,

            y: terrainHeight(70, -230) + 40,

            height: 3,

            speed: .7,

            velocityY: 0,

            grounded: false

        };
        let treeColliders = [];
        let yaw = 0;
        let pitch = 0;


        const gravity = -.025;
        const jump = .8;
        let guns = ["assult", "snipe", "shotty", "rocket"]

        let ammo = {
            "assult": 160,
            "snipe": 8,
            "shotty": 10,
            "rocket": 4
        }
        function fire() {
            if (gun === "assult") {
                if (ammo.assult <= 0) return;
                let p = new THREE.Mesh(
                    new THREE.BoxGeometry(0.6, 0.6, 0.6),
                    bullet
                );

                p.position.copy(camera.position);

                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);

                p.dx = dir.x + Math.random() / 10 - 0.05;
                p.dy = dir.y + Math.random() / 10 - 0.05;
                p.dz = dir.z + Math.random() / 10 - 0.05;
                p.damage = 0.34
                p.type = "assult"

                scene.add(p);
                bullets.push(p);
                ammo.assult -= 1
            } else if (gun === "snipe") {
                if (ammo.snipe <= 0) return;
                let p = new THREE.Mesh(
                    new THREE.BoxGeometry(1, 1, 1),
                    bullet
                );

                p.position.copy(camera.position);

                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);

                p.dx = dir.x
                p.dy = dir.y
                p.dz = dir.z
                p.damage = 1
                p.type = "snipe"

                scene.add(p);
                bullets.push(p);
                ammo.snipe -= 1
            } else if (gun === "shotty") {
                if (ammo.shotty <= 0) return;
                for (let i = 0; i < 60; i++) {
                    let p = new THREE.Mesh(
                        new THREE.BoxGeometry(0.6, 0.6, 0.6),
                        bullet
                    );

                    p.position.copy(camera.position);

                    const dir = new THREE.Vector3();
                    camera.getWorldDirection(dir);

                    p.dx = dir.x + Math.random() / 10 - 0.05;
                    p.dy = dir.y + Math.random() / 10 - 0.05;
                    p.dz = dir.z + Math.random() / 10 - 0.05;
                    p.damage = 0.1
                    p.type = "shotty"

                    scene.add(p);
                    bullets.push(p);

                }
                ammo.shotty -= 1
            } else if (gun === "rocket") {
                if (ammo.rocket <= 0) return;
                let p = new THREE.Mesh(
                    new THREE.BoxGeometry(4, 4, 4),
                    bullet
                );

                p.position.copy(camera.position);

                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);

                p.dx = dir.x / 6
                p.dy = dir.y / 6
                p.dz = dir.z / 6
                p.damage = 3
                p.type = "rocket"

                scene.add(p);
                bullets.push(p);
                ammo.rocket -= 1
            }
            const gunIMG = document.getElementById("gunIMG");

            if (gun === "assult") gunIMG.src = gunFireA.src;
            if (gun === "shotty") gunIMG.src = gunFireSh.src;

            setTimeout(() => {
                if (gun === "assult") gunIMG.src = gunIdleA.src;
                if (gun === "shotty") gunIMG.src = gunIdleSh.src;
            }, 25);
            updateAmmo()
        }



        // MOUSE LOOK

        let eBullets = []



        renderer.domElement.onclick = () => {

            renderer.domElement.requestPointerLock();

        };


        let isZoomed = false
        let isFiring = false

        window.addEventListener('mousedown', (event) => {
            if (event.button === 2) {
                isZoomed = true
                if (gun === "snipe") {
                    document.getElementById('overLay').style.opacity = '1'
                    document.getElementById('gunIMG').style.opacity = '0'
                    document.getElementById('plus').style.opacity = '0'
                }

            }
            if (event.button === 0) {
                isFiring = true
            }
        });

        window.addEventListener('mouseup', (event) => {
            if (event.button === 2) {
                isZoomed = false
                if (gun === "snipe") {
                    document.getElementById('overLay').style.opacity = '0'
                    document.getElementById('gunIMG').style.opacity = '1'
                    document.getElementById('plus').style.opacity = '1'
                }
            }
            if (event.button === 0) {
                isFiring = false
            }
        });


        let sensitivity = 0.002
        document.addEventListener(
            "mousemove",
            e => {

                if (document.pointerLockElement !== renderer.domElement)
                    return;


                yaw -= e.movementX * sensitivity;

                pitch -= e.movementY * sensitivity;


                pitch = Math.max(
                    -1.5,
                    Math.min(1.5, pitch)
                );

            });



        // INPUT


        let keys = {};


        addEventListener(
            "keydown",
            e => {
                keys[e.code] = true;
                if (keys.KeyQ) {
                    if (gun === "assult") {
                        gun = "snipe"
                        document.getElementById("crossHair").style.width = "20px"
                    } else if (gun === "snipe") {
                        gun = "shotty"
                        document.getElementById("plus").innerHTML = `<p id="shotHair">o</p>`
                    } else if (gun === "shotty") {
                        gun = "rocket"
                        document.getElementById("plus").innerHTML = `<img id="crossHair" src="images/halo_assault_rifle_crosshair.png" alt="Crosshair">`
                        document.getElementById("crossHair").style.width = "400px"
                    } else if (gun === "rocket") {
                        gun = "assult"
                        document.getElementById("plus").innerHTML = `<img id="crossHair" src="images/halo_assault_rifle_crosshair.png" alt="Crosshair">`
                        document.getElementById("crossHair").style.width = "250px"
                    }
                    document.getElementById('current').innerText = `${gun}`
                    if (gun === "assult") gunIMG.src = gunIdleA.src;
                    if (gun === "shotty") gunIMG.src = gunIdleSh.src;
                    if (gun === "snipe") gunIMG.src = gunFireSn.src;
                    updateAmmo()
                }
            });



        addEventListener(
            "keyup",
            e => {
                keys[e.code] = false;
            });





        // TERRAIN COLLISION









        function canMove(x, z) {

            let current =
                terrainHeight(
                    player.x,
                    player.z
                );


            let next =
                terrainHeight(
                    x,
                    z
                );


            // prevent walking into cliffs

            if (next - current > 2.5)
                return false;


            return true;

        }



        function updateGround() {

            let ground =
                terrainHeight(
                    player.x,
                    player.z
                );



            if (player.y - player.height <= ground) {

                player.y =
                    ground + player.height;

                player.velocityY = 0;

                player.grounded = true;

            }
            else {

                player.grounded = false;

            }

        }

        let groundAt = Math.max(terrainHeight(100, -200), -50) + 7
        //Ground level
        spawnPlatform(100, groundAt - 19, -200, 60, 20, 60, true)
        //walls
        spawnPlatform(100, groundAt + 1, -200, 1, 60, 60, true)
        spawnPlatform(100, groundAt + 1, -260, 60, 60, 1, true)
        spawnPlatform(40, groundAt + 1, -200, 1, 60, 60, true)
        spawnPlatform(100, groundAt + 1, -200, 60, 10, 1, true)
        //roof
        spawnPlatform(100, groundAt + 60, -200, 60, 1, 60, true)
        //stair
        spawnPlatform(75, groundAt + 10, -185, 10, 1, 10, true)
        spawnPlatform(60, groundAt + 20, -185, 10, 1, 10, true)
        spawnPlatform(75, groundAt + 30, -185, 10, 1, 10, true)
        spawnPlatform(60, groundAt + 40, -185, 10, 1, 10, true)
        spawnPlatform(75, groundAt + 50, -185, 10, 1, 10, true)

        //enemies
        spawnTarget(40, groundAt + 61, -210, 1, true)

        for (let i = 0; i < 60; i++) {
            let groupX = 0
            let groupZ = 0

            groupX = Math.random() * size - size / 2
            groupZ = Math.random() * size - size / 2

            spawnPlatform(groupX, terrainHeight(groupX, groupZ) - 35, groupZ, Math.random() * 50 + 5, Math.random() * 50 + 35, Math.random() * 50 + 5, true)
        }

        for (let i = 0; i < 20; i++) {
            let groupX = 0
            let groupZ = 0
            do {
                groupX = Math.random() * size - size / 2
                groupZ = Math.random() * size - size / 2
            } while (terrainHeight(groupX, groupZ) < -75);
            const max = 8
            const min = 2
            let groupSize = Math.ceil(Math.random() * (max - 1) + min)
            for (let n = 0; n < groupSize; n++) {
                spawnTarget(groupX + Math.random() * 40 - 20, 0, groupZ + Math.random() * 40 - 20)
            }
        }

        //trees
        for (let i = 0; i < 14; i++) {
            let groupX = 0
            let groupZ = 0
            do {
                groupX = Math.random() * size - size / 2
                groupZ = Math.random() * size - size / 2
            } while (terrainHeight(groupX, groupZ) < -75);
            const max = 8
            const min = 3
            let groupSize = Math.ceil(Math.random() * (max - 1) + min)
            for (let n = 0; n < groupSize; n++) {
                spawnTree(groupX + Math.random() * 200 - 100, groupZ + Math.random() * 200 - 100, Math.random() * 6 + 3)
            }

        }

        //ammos
        for (let i = 0; i < 10; i++) {
            let groupX = 0
            let groupZ = 0
            do {
                groupX = Math.random() * size - size / 2
                groupZ = Math.random() * size - size / 2
            } while (terrainHeight(groupX, groupZ) < -75);
            const max = 1
            const min = 1
            let groupSize = Math.ceil(Math.random() * (max - 1) + min)
            for (let n = 0; n < groupSize; n++) {
                dropAmmo(groupX + Math.random() * 200 - 100, groupZ + Math.random() * 200 - 100)
            }

        }
        function removeBulletsInWalls(bullet) {

            const oldPos = bullet.position.clone().sub(
                new THREE.Vector3(bullet.dx, bullet.dy, bullet.dz)
            );

            const direction = new THREE.Vector3().subVectors(
                bullet.position,
                oldPos
            );

            const raycaster = new THREE.Raycaster(
                oldPos,
                direction.clone().normalize(),
                0,
                direction.length()
            );

            let hitWall = false;

            for (const obj of [...platforms, ...treeColliders]) {

                if (raycaster.intersectObject(obj).length > 0) {
                    hitWall = true;
                    break;
                }

            }

            if (bullet.position.y < terrainHeight(
                bullet.position.x,
                bullet.position.z
            ) - 3) {
                hitWall = true;
            }

            if (hitWall) {
                if (bullet.type === "rocket") {
                    bullet.position.y = terrainHeight(
                        bullet.position.x,
                        bullet.position.z
                    ) + 2; // a little above the ground

                    const radius = 30;
                    bullet.scale.set(2, 2, 2);
                    setTimeout(() => {
                        bullet.scale.set(4, 4, 4);
                    }, 50);
                    setTimeout(() => {
                        bullet.scale.set(6, 6, 6);
                    }, 100);
                    setTimeout(() => {
                        bullet.scale.set(8, 8, 8);
                    }, 150);

                    bullet.position.addScaledVector(
                        new THREE.Vector3(-bullet.dx, -bullet.dy, -bullet.dz),
                        4
                    );
                    bullet.dx = 0
                    bullet.dy = 0
                    bullet.dz = 0

                    // damage enemies
                    for (let target of [...targets]) {

                        const dist = bullet.position.distanceTo(target.position);

                        if (dist < radius) {
                            target.health -= 3;

                            if (target.health <= 0) {
                                kills++;
                                document.getElementById("kills").innerText = kills;

                                scene.remove(target);
                                targets.splice(targets.indexOf(target), 1);
                            }
                        }
                    }

                    setTimeout(() => {
                        scene.remove(bullet);
                        bullets.splice(bullets.indexOf(bullet), 1);
                    }, 200);
                } else {
                    scene.remove(bullet);

                    const list = bullets.includes(bullet)
                        ? bullets
                        : eBullets;

                    const index = list.indexOf(bullet);

                    if (index !== -1)
                        list.splice(index, 1);
                }

            }

        }
        let healCooldown = 300




        // GAME LOOP ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
        //------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
        //------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
        //------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
        //------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
        //------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
        //------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
        let kills = 0

        let maxCooldown = 2.5
        let cooldown = 0


        function animate() {

            requestAnimationFrame(
                animate
            );
            let bulletSpeed = 200


            camera.fov = isZoomed ? 15 : 90;
            camera.updateProjectionMatrix();
            sensitivity = 0.002
            if (isZoomed) {
                sensitivity = 0.0005
            }
            for (let bullet of bullets) {

                const oldPos = bullet.position.clone();

                bullet.position.x += bullet.dx * bulletSpeed;
                bullet.position.y += bullet.dy * bulletSpeed;
                bullet.position.z += bullet.dz * bulletSpeed;

                const direction = new THREE.Vector3()
                    .subVectors(bullet.position, oldPos);

                const raycaster = new THREE.Raycaster(
                    oldPos,
                    direction.clone().normalize(),
                    0,
                    direction.length()
                );

                const hits = raycaster.intersectObjects(targets);

                if (hits.length > 0) {

                    let target = hits[0].object;

                    // Go up until we find the object stored in targets[]
                    while (target && !targets.includes(target)) {
                        target = target.parent;
                    }

                    if (target) {
                        target.health -= bullet.damage
                        if (target.health <= 0) {
                            kills += 1
                            document.getElementById('kills').innerText = `${kills}`
                            scene.remove(target);

                            const index = targets.indexOf(target);
                            if (index !== -1) {
                                targets.splice(index, 1);
                            }
                        }
                    }

                    scene.remove(bullet);

                    const bulletIndex = bullets.indexOf(bullet);
                    if (bulletIndex !== -1) {
                        bullets.splice(bulletIndex, 1);
                    }
                }
                let dist = Math.sqrt((player.x - bullet.position.x) * (player.x - bullet.position.x) + (player.z - bullet.position.z) * (player.z - bullet.position.z))
                if (dist > 1500) {
                    bullets.splice(bullets.indexOf(bullet), 1)
                    scene.remove(bullet)
                }
                if (dist > 400 && (bullet.type === "shotty" || bullet.type === "assult")) {
                    bullets.splice(bullets.indexOf(bullet), 1)
                    scene.remove(bullet)
                }

                removeBulletsInWalls(bullet)
            }

            let speed = player.speed;

            if (gun === "assult") {
                maxCooldown = 2.5
            } else if (gun === "snipe") {
                maxCooldown = 40
            } else if (gun === "shotty") {
                maxCooldown = 30
            } else if (gun === "rocket") {
                maxCooldown = 180
            }


            if (keys.ShiftLeft || keys.ShiftRight)
                speed *= 2;



            let mx = 0;
            let mz = 0;



            let fx = Math.sin(yaw);
            let fz = Math.cos(yaw);



            if (keys.KeyW) {

                mx -= fx;
                mz -= fz;

            }



            if (keys.KeyS) {

                mx += fx;
                mz += fz;

            }

            cooldown -= 1
            if (cooldown < 0 && isFiring) {
                fire()
                cooldown = maxCooldown
            }


            if (keys.KeyA) {

                mx -= Math.cos(yaw);
                mz += Math.sin(yaw);

            }


            if (keys.KeyD) {

                mx += Math.cos(yaw);
                mz -= Math.sin(yaw);

            }



            let len = Math.sqrt(
                mx * mx + mz * mz
            );


            if (len) {

                mx /= len;
                mz /= len;

            }
            for (let target of targets) {
                let dist = Math.sqrt((player.x - target.position.x) * (player.x - target.position.x) + (player.z - target.position.z) * (player.z - target.position.z))
                if (dist > 800) continue;
                let dx = player.x - target.position.x
                let dz = player.z - target.position.z
                let dy = player.y - target.position.y
                const enemyBulletSpeed = 0.08
                const mobSpeed = 0.16
                target.timeToUnlock -= 1
                //dist > 80 && 
                if (target.timeToUnlock <= 0) {

                    if (target.time < 150) {
                        target.position.x += mobSpeed
                    } else if (target.time > 200 && target.time < 350) {
                        target.position.z -= mobSpeed
                    } else if (target.time > 400 && target.time < 550) {
                        target.position.x -= mobSpeed
                    } else if (target.time > 600 && target.time < 750) {
                        target.position.z += mobSpeed
                        target.position.x += mobSpeed
                    } else if (target.time > 800 && target.time < 950) {
                        target.position.z -= mobSpeed
                    } else if (target.time > 1000 && target.time < 1150) {
                        target.position.z += mobSpeed
                        target.position.x -= mobSpeed
                    } else if (target.time > 1200) {
                        target.time = 0
                    }
                } else {
                    //if (dist < 80) { target.timeToUnlock = 100 }
                    //target.position.x -= dx / dist * mobSpeed * 2.2;
                    //target.position.z -= dz / dist * mobSpeed * 2.2;
                }

                if (target.time % 120 < 0.5 && dist < 180) {
                    let dx = player.x - target.position.x
                    let dz = player.z - target.position.z
                    let dy = player.y - target.position.y
                    let p = new THREE.Mesh(
                        new THREE.BoxGeometry(0.6, 0.6, 0.6),
                        eBulletMAT
                    );
                    p.position.set(target.position.x, target.position.y + 2, target.position.z)
                    p.dx = dx * enemyBulletSpeed + Math.random() - 0.5
                    p.dy = dy * enemyBulletSpeed + Math.random() - 0.5
                    p.dz = dz * enemyBulletSpeed + Math.random() - 0.5


                    eBullets.push(p)
                    scene.add(p)
                    setTimeout(() => {
                        let dx = player.x - target.position.x
                        let dz = player.z - target.position.z
                        let dy = player.y - target.position.y
                        let p = new THREE.Mesh(
                            new THREE.BoxGeometry(0.6, 0.6, 0.6),
                            eBulletMAT
                        );
                        p.position.set(target.position.x, target.position.y, target.position.z)
                        p.dx = dx * enemyBulletSpeed + Math.random() - 0.5
                        p.dy = dy * enemyBulletSpeed + Math.random() - 0.5
                        p.dz = dz * enemyBulletSpeed + Math.random() - 0.5


                        eBullets.push(p)
                        scene.add(p)
                    }, 300);
                    setTimeout(() => {
                        let dx = player.x - target.position.x
                        let dz = player.z - target.position.z
                        let dy = player.y - target.position.y
                        let p = new THREE.Mesh(
                            new THREE.BoxGeometry(0.6, 0.6, 0.6),
                            eBulletMAT
                        );
                        p.position.set(target.position.x, target.position.y, target.position.z)
                        p.dx = dx * enemyBulletSpeed + Math.random() - 0.5
                        p.dy = dy * enemyBulletSpeed + Math.random() - 0.5
                        p.dz = dz * enemyBulletSpeed + Math.random() - 0.5


                        eBullets.push(p)
                        scene.add(p)
                    }, 600);
                }
                target.time += 0.5


                if (!target.based) target.position.y = terrainHeight(target.position.x, target.position.z) - 2;

            }

            for (let bullet of eBullets) {
                let dist = Math.cbrt(
                    (player.x - bullet.position.x) * (player.x - bullet.position.x) +
                    (player.z - bullet.position.z) * (player.z - bullet.position.z) +
                    (player.y - bullet.position.y) * (player.y - bullet.position.y)
                );


                bullet.position.x += bullet.dx;
                bullet.position.y += bullet.dy;
                bullet.position.z += bullet.dz;

                removeBulletsInWalls(bullet)

                if (dist < 4) {
                    health -= 15
                    healCooldown = 160
                    scene.remove(bullet);

                    const list = bullets.includes(bullet)
                        ? bullets
                        : eBullets;

                    const index = list.indexOf(bullet);

                    if (index !== -1)
                        list.splice(index, 1);

                    if (health <= 0) {
                        home()
                    }

                }
                if (dist > 200) {
                    scene.remove(bullet);

                    const list = bullets.includes(bullet)
                        ? bullets
                        : eBullets;

                    const index = list.indexOf(bullet);

                    if (index !== -1)
                        list.splice(index, 1);
                }
            }

            for (let ammoBox of ammos) {
                let dist = Math.cbrt(
                    (player.x - ammoBox.position.x) ** 2 +
                    (player.z - ammoBox.position.z) ** 2 +
                    (player.y - ammoBox.position.y) ** 2
                );

                if (dist < 5) {
                    ammo.assult += 100;
                    ammo.snipe += 4;
                    ammo.shotty += 5;
                    ammo.rocket += 2;

                    scene.remove(ammoBox);
                    ammos.splice(ammos.indexOf(ammoBox), 1);

                    updateAmmo();
                }
            }

            if (healCooldown <= 0) {
                health += 0.5
                health = Math.min(health, 100)
            }
            healCooldown -= 1
            document.getElementById("progressBar").style.width = `${health}%`;






            let nx =
                player.x + mx * speed;


            let nz =
                player.z + mz * speed;

            const wierd = 1
            let cnx =
                player.x + mx * (speed * wierd);


            let cnz =
                player.z + mz * (speed * wierd);



            let blockedX = false;
            let blockedZ = false;

            const colliders = [...platforms, ...treeColliders];

            for (let obj of colliders) {
                //let dist = Math.sqrt((player.x - obj.position.x) * (player.x - obj.position.x) + (player.z - obj.position.z) * (player.z - obj.position.z))
                //if (dist > 10) continue;


                if (isInWall(obj, cnx, player.z))
                    blockedX = true;

                if (isInWall(obj, player.x, cnz))
                    blockedZ = true;

            }

            if (canMove(nx, player.z) && !blockedX)
                player.x = nx;

            if (canMove(player.x, nz) && !blockedZ)
                player.z = nz;

            // gravity

            player.velocityY += gravity;
            player.y += player.velocityY;


            // terrain collision

            updateGround();

            if (player.y < -50) {
                player.grounded = true
            }
            checkWater();


            // platform collision

            [...platforms, ...treeColliders].forEach(p => {

                if (playerHitsPlatform(p) && player.velocityY <= 0) {

                    player.y =
                        p.position.y +
                        p.height / 2 +
                        player.height;

                    player.velocityY = 0;

                    player.grounded = true;

                }

            });



            // jump

            if (keys.Space && player.grounded) {

                player.velocityY = jump;
                player.grounded = false;

            }




            camera.position.set(
                player.x,
                player.y,
                player.z
            );


            camera.rotation.order = "YXZ";

            camera.rotation.y = yaw;

            camera.rotation.x = pitch;



            renderer.render(
                scene,
                camera
            );

        }


        animate();





        addEventListener(
            "resize",
            () => {

                camera.aspect =
                    innerWidth / innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    innerWidth,
                    innerHeight
                );

            });

    </script>

</body>

<!DOCTYPE html>
<html>

<head>
    <title>Games.io |Dash</title>
    <link rel="stylesheet" href="styles1.css" />
    <link rel="icon" type="image/png" href="images/plat.png">
</head>

<body>
    <div id="instructions">
        Up arrow/space = jump ⤒ <br> Brick is normal platform
        <br>Lava is death <br>Slime is bouncy platform <br>Water is reverse gravity 
    </div>
    <canvas id="gameCanvas" height="400" width="800"></canvas>
    <div id="stuff">
        <p id="cord">x: 0, y: 0</p>
        <select id="levelSelect">
            <option value="1">Level 1</option>
            <option value="2">Level 2</option>
            <option value="3">Level 3</option>
            <option value="4">Level 4</option>
            <option value="5">Level 5</option>
            <option value="6">Level 6</option>
            <option value="7">Level 7</option>
            <option value="8">Level 8</option>
            <option value="9">Level 9</option>
            <option value="10">Level 10</option>
            <option value="11">Level 11</option>
            <option value="12">Level 12</option>
            <option value="13">Level 13</option>
            <option value="14">Level 14</option>
            <option value="15">Level 15</option>
            <option value="16">Level 16</option>
            <option value="17">Level 17</option>
            <option value="18">Level 18</option>
            <option value="19">Level 19</option>
            <option value="20">Level 20</option>
            <option value="21">Level 21</option>
            <option value="22">Level 22</option>
            <option value="23">Level 23</option>

        </select>

        <button onclick="home()" id="home">Home</button>
        <button onclick="changeBackground()" id="background">Sky</button>
        <div id="mobileControls">
            <button id="jump">⤒</button>
        </div>
    </div>
    <audio id="deathSound" preload="auto">
        <source src="audio/platformer/death.mp3" type="audio/mp3">
        <source src="audio/platformer/death.ogg" type="audio/ogg">
    </audio>
    <audio id="bounceSound" preload="auto">
        <source src="audio/platformer/slime-bounce.mp3" type="audio/mp3">
        <source src="audio/platformer/slime-bounce.ogg" type="audio/ogg">
    </audio>
    <audio id="checkpointSound" preload="auto">
        <source src="audio/platformer/checkpoint-sound.mp3" type="audio/mp3">
        <source src="audio/platformer/checkpoint-sound.ogg" type="audio/ogg">
    </audio>
    <audio id="finishSound" preload="auto">
        <source src="audio/platformer/finish-sound.mp3" type="audio/mp3">
        <source src="audio/platformer/finish-sound.ogg" type="audio/ogg">
    </audio>




    <script>

        function home() {
            window.location.href = "index.html";
        }
        window.addEventListener("keydown", function (e) {
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
        }, false);

        function finish() {
            window.location.href = "end.html"
        }

        const canvas = document.getElementById('gameCanvas');
        localStorage.setItem('platLevel', localStorage.getItem('platLevel') || "1")
        const options = document.querySelectorAll('option')



        const ctx = canvas.getContext('2d');
        const basegravity = 0.73
        let gravity = basegravity;
        let isGameOver = false;
        let highScore = 0;
        let imagesLoaded = 0;
        const totalImages = 2;

        document.body.addEventListener('touchmove', e => {
            e.preventDefault();
        }, { passive: false });

        function bindButton(id, key) {
            const btn = document.getElementById(id);

            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                keys[key] = true;
            }, { passive: false });

            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                keys[key] = false;
            });

            // ALSO support mouse (for testing on desktop)
            btn.addEventListener('mousedown', () => keys[key] = true);
            btn.addEventListener('mouseup', () => keys[key] = false);
        }


        bindButton("jump", "Space");


        const keys = {};
        const brick = new Image();

        brick.src = "images/pixil-frame-0 (4).png";

        let playerImg = new Image();
        playerImg.src = "images/pixil-frame-0%20(1).png";

        const death = new Image();

        death.src = "images/pixil-frame-0%20(77).png";

        const water = new Image();

        water.src = "images/pixil-frame-0%20(6).png";


        const slime = new Image();

        slime.src = "images/pixil-frame-0%20(11).png"

        let sky = new Image();

        sky.src = "images/pixil-frame-0%20(3).png";

        let isCaveBackground = true

        const cannon = new Image();
        cannon.src = "images/pixil-frame-0%20(2).png";

        const playerLauncher = new Image();
        playerLauncher.src = "images/pixil-frame-0 (playerLauncher).png"

        const portalIMG = new Image();
        portalIMG.src = "images/pixil-frame-0-2.png";

        const deathSound = document.getElementById("deathSound");
        function playDeathSound() {
            deathSound.currentTime = 0;
            deathSound.play();
        }

        const bounceSound = document.getElementById("bounceSound");
        function playBounceSound() {
            bounceSound.currentTime = 0;
            bounceSound.play();
        }

        const checkpointSound = document.getElementById("checkpointSound");
        function playCheckpointSound() {
            checkpointSound.currentTime = 0;
            checkpointSound.play();
        }

        const finishSound = document.getElementById("finishSound");
        function playFinishSound() {
            finishSound.currentTime = 0;
            finishSound.play();
        }
        let playedFinishSound = false;
        let hadSetTimeout = false;

        const bulletIMG = new Image();
        bulletIMG.src = "images/Screen Shot 2026-05-04 at 2.50.58 PM.png";

        function changeBackground() {
            if (isCaveBackground) {
                sky.src = "images/Screen%20Shot%202026-04-24%20at%2012.34.40%20PM.png";
                isCaveBackground = false
                document.querySelector('#background').innerText = 'Cave'
            }
            else {
                sky.src = "images/pixil-frame-0%20(3).png";
                isCaveBackground = true
                document.querySelector('#background').innerText = 'Sky'
            }
        }
        let portals = []


        const player = {
            x: 50,
            y: 310,
            width: 20,
            height: 20,
            dx: 0,
            dy: 0,
            speed: 7,
            jumpPower: -10.5,
            grounded: false
        };
        let scrollX = 0;
        scrollX = player.x - 400;
        let scrollY = 0;
        scrollY = player.y - 200;

        let platforms = [];
        let dangers = [];
        let enemys = [];
        let thickness = 20
        let currentX = 400;
        let deathNum = 0;
        let currentY = 300;
        let save = {
            x: 50,
            y: 310
        }
        let cooldown = false
        let dashCooldown = 0;
        let level = Number(localStorage.getItem("platLevel"));
        let printLevel = level;
        const DASH_DURATION = 1;

        function flipPlayerIMG() {
            playerImg.src = "images/flip.png"
        }

        function unflipPlayerIMG() {
            playerImg.src = "images/pixil-frame-0 (1).png"
        }

        let end = {
            x: 0,
            y: 0
        }
        let time = 0
        const levelsNum = 23
        setInterval(() => {
            time += 1
        }, 1000)




        function SpawnEnemy(px, py) {
            enemys.push({ x: px, y: py })
        }

        function addPlatform(px, py, w, h, danger = false, bouncy = false, isWater = false, checkpoint = false) {
            if (!danger) platforms.push({ x: px, y: py, width: w, height: h, b: bouncy, water: isWater, check: checkpoint })
            else dangers.push({ x: px, y: py, width: w, height: h })
        }


        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        bullets = []

        setInterval(() => {
            for (const enemy of enemys) {
                bullets.push({ x: enemy.x, y: enemy.y })
            }
        }, 4000);
        function addPortal(cx, cy, dx, dy) {
            portals.push({ x: cx, y: cy, changeX: dx, changeY: dy })
        }

        addPlatform(0, 380, 80000, 20)
        addPlatform(0, 360, 80000, 20)
        addPlatform(0, 340, 80000, 20)
        for (let i = 0; i < 300; i++) {

            const numOfLevels = 2
            let roll = Math.ceil(Math.random() * (numOfLevels + 1))
            if (roll === 1) {
                addPlatform(currentX, 320, 20, 20, true)

                let roll1 = Math.random()
                if (roll1 < 0.3) {
                    addPlatform(currentX + 20, 320, 20, 20, true)
                }

                if (roll1 < 0.1) {
                    addPlatform(currentX + 40, 320, 20, 20, true)
                }
                currentX += Math.random() * 140 + 350
            } else if (roll === 2) {
                const gap = 80
                addPlatform(currentX-40, 320, 60, 20)
                addPlatform(currentX + gap, 300, 30, 20)
                addPlatform(currentX + gap * 2, 280, 30, 20)
                addPlatform(currentX + gap * 3, 260, 30, 20)
                addPlatform(currentX + gap * 4, 240, 30, 20)
                addPlatform(currentX + 20, 320, gap*4, 20, true)

                currentX += Math.random() * 140 + 500
            }
        }


        function update() {
            const framesPerSecond = 65
            player.x += 10.4 / framesPerSecond * 20

            localStorage.setItem('Score', highScore);
            localStorage.setItem('Deaths', deathNum);
            localStorage.setItem('Time', time)

            highScore = Math.max(Math.round(player.x), highScore)
            document.querySelector("#cord").innerText = `x: ${Math.round(player.x)}, y: ${Math.round(player.y)}, Highest score: ${highScore}, Level: ${printLevel}, Deaths: ${deathNum}, Time: ${time}`
            let moveDir = 0;

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x -= 5;

                if (player.x < b.x + 10 && player.x + player.width > b.x && player.y < b.y + 10 && player.y + player.height > b.y) {
                    player.x = save.x;
                    player.y = save.y;
                    playDeathSound();
                    deathNum += 1
                    player.dy = 0;
                    bullets.splice(i, 1);
                    continue;
                }
                if (b.x > player.x + 1600) {
                    bullets.splice(i, 1);
                }
            }

            if ((keys['ArrowUp'] || keys['Space'] || keys['KeyW']) && player.grounded) {
                if (gravity > 0) player.dy = player.jumpPower;
                else player.dy = player.dy = -player.jumpPower / 1.3;
                player.grounded = false;
            }

            if (!isGameOver) {
                player.dy += gravity;
            } else {
                player.dy = 0;
                player.dx = 0;
            }

            player.grounded = false;
            gravity = basegravity


            for (let plat of platforms) {
                if (plat.x > player.x + 200) { continue; }
                if (player.x < plat.x + plat.width &&
                    player.x + player.width > plat.x &&
                    player.y < plat.y + plat.height &&
                    player.y + player.height > plat.y && !keys['ArrowDown']) {
                    if (plat.b) {
                        if (gravity > 0) {
                            if (player.dy > 0) {
                                player.dy = -20;
                                playBounceSound();
                                continue;
                            }
                            continue;
                        }
                        player.dy = 15;
                        playBounceSound();
                        continue;

                    }
                    if (!plat.water) { unflipPlayerIMG(); };
                    if (plat.water) { gravity = -basegravity / 2; flipPlayerIMG(); continue; };
                    if (plat.check) { printLevel += 1; plat.check = false; save.x = player.x + 10; save.y = player.y; playCheckpointSound(); if (Number(localStorage.getItem('platLevel')) < printLevel) localStorage.setItem('platLevel', String(printLevel)); revampLevels() };
                    if (gravity > 0) {

                        if (player.dy > 0 && player.y + player.height - player.dy <= plat.y + 5) {
                            player.y = plat.y - player.height;
                            player.dy = 0;
                            player.grounded = true;
                        }
                    } else {
                        if (player.dy < 0 && player.y - player.dy >= plat.y + plat.height - 5) {
                            player.y = plat.y + plat.height;
                            player.dy = 0;
                            player.grounded = true;
                        }
                    }

                }
            }
            for (let portal of portals) {
                if (portal.x > player.x + 300) { continue; }
                if (player.x < portal.x + 20 &&
                    player.x + player.width > portal.x &&
                    player.y < portal.y + 20 &&
                    player.y + player.height > portal.y) {

                    player.x += portal.changeX;
                    player.y += portal.changeY;
                }
            }

            for (let dang of dangers) {
                if (dang.x > player.x + 300) { continue; }
                const hitBoxDecrease = 4
                if (player.x < dang.x + dang.width - hitBoxDecrease &&
                    player.x + player.width > dang.x + hitBoxDecrease &&
                    player.y < dang.y + dang.height - hitBoxDecrease &&
                    player.y + player.height > dang.y+ hitBoxDecrease) {

                    playDeathSound();

                    player.x = save.x;
                    player.y = save.y;
                    deathNum += 1
                    player.dy = 0;
                }
            }

            if (player.y > canvas.height) {
                player.x = save.x;
                player.y = save.y;
                deathNum += 1
                player.dy = 0;
            }
            scrollX = player.x - 200;
            scrollY = player.y - 0.5 * canvas.height;

        }

        function draw() {
            ctx.drawImage(sky, 0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(
                Math.min(0, -scrollX),
                Math.max(canvas.height - 400, -scrollY)
            );

            ctx.fillStyle = '#287271';
            nope = false
            platforms.forEach(plat => {

                if (plat.b) {
                    for (let b = 0; b < plat.width; b += 20) {
                        ctx.drawImage(slime, plat.x + b, plat.y, 20, plat.height);
                    }
                    nope = true
                } else if (plat.water) {
                    for (let b = 0; b < plat.width; b += 20) {
                        for (let k = 0; k < plat.height; k += 160) {
                            ctx.drawImage(water, plat.x + b, plat.y + k, 20, 160);
                        }
                    }
                    nope = true
                } else if (plat.check) {
                    ctx.fillStyle = '#87CEEB';
                    nope = false
                } else {
                    nope = true
                    if (plat.height > 60) {
                        nope = false
                        ctx.fillStyle = '#6792e0';
                    }
                    for (let b = 0; b < plat.width; b += 10) {
                        if (nope) ctx.drawImage(brick, plat.x + b, plat.y, 10, plat.height);
                    }

                }
            });


            dangers.forEach(plat => {
                for (let b = 0; b < plat.width; b += 20) {
                    ctx.drawImage(death, plat.x + b, plat.y, 20, plat.height);
                }
            });
            ctx.fillStyle = '#f4a261';
            enemys.forEach(enemy => {
                ctx.drawImage(cannon, enemy.x, enemy.y, 30, 30);
            });

            ctx.fillStyle = '#e76f51';
            bullets.forEach(bullet => {
                ctx.drawImage(bulletIMG, bullet.x, bullet.y, 10, 10);
            });

            portals.forEach(portal => {
                ctx.drawImage(portalIMG, portal.x, portal.y - 30, 60, 60);
            });

            ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);
            ctx.fillStyle = '#00ffff';

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            setTimeout(() => {
                requestAnimationFrame(loop);
            }, 10);

        }

        loop();
    </script>
</body>

</html>

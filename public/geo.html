<!DOCTYPE html>
<html>

<head>
    <title>Games.io |Dash</title>
    <link rel="stylesheet" href="styles1.css" />
    <link rel="icon" type="image/png" href="images/plat.png">
</head>

<body>
    <div id="instructions">
        Up arrow/space = jump ⤒ <br> Brick is normal platform
        <br>Lava is death <br>Slime is bouncy platform <br>Water is reverse gravity
    </div>
    <canvas id="gameCanvas" height="400" width="800"></canvas>
    <button onclick="home()" id="home">Home</button>
    <div id="stuff" style="display: none;">
        <p id="cord">x: 0, y: 0</p>
        <button onclick="changeBackground()" id="background">Sky</button>
    </div>
    <h1 id="announcement" style="display: none;"></h1>
    <div id="progressContainer">
        <div id="progressBarMax"></div>
        <div id="progressBar"></div>
    </div>
    <div id="mobileControls" style="display: none;">
        <button id="jump">⤒</button>
    </div>
    <audio id="deathSound" preload="auto">
        <source src="audio/platformer/death.mp3" type="audio/mp3">
        <source src="audio/platformer/death.ogg" type="audio/ogg">
    </audio>
    <audio id="bounceSound" preload="auto">
        <source src="audio/platformer/slime-bounce.mp3" type="audio/mp3">
        <source src="audio/platformer/slime-bounce.ogg" type="audio/ogg">
    </audio>
    <audio id="checkpointSound" preload="auto">
        <source src="audio/platformer/checkpoint-sound.mp3" type="audio/mp3">
        <source src="audio/platformer/checkpoint-sound.ogg" type="audio/ogg">
    </audio>
    <audio id="finishSound" preload="auto">
        <source src="audio/platformer/finish-sound.mp3" type="audio/mp3">
        <source src="audio/platformer/finish-sound.ogg" type="audio/ogg">
    </audio>




    <script>

        function home() {
            window.location.href = "index.html";
        }
        window.addEventListener("keydown", function (e) {
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
        }, false);

        function finish() {
            window.location.href = "end.html"
        }

        const canvas = document.getElementById('gameCanvas');



        const ctx = canvas.getContext('2d');
        let basegravity = 0.73
        let gravity = basegravity;
        let isGameOver = false;
        let highScore = 0;
        let imagesLoaded = 0;
        const totalImages = 2;

        document.body.addEventListener('touchmove', e => {
            e.preventDefault();
        }, { passive: false });

        function bindButton(id, key) {

            document.addEventListener('touchstart', (e) => {
                e.preventDefault();
                keys[key] = true;
            }, { passive: false });

            document.addEventListener('touchend', (e) => {
                e.preventDefault();
                keys[key] = false;
            });

            document.addEventListener('mousedown', () => keys[key] = true);
            document.addEventListener('mouseup', () => keys[key] = false);
        }


        bindButton("jump", "Space");


        const keys = {};
        const brick = new Image();

        brick.src = "images/pixil-frame-0 (4).png";

        let playerImg = new Image();
        playerImg.src = "images/pixil-frame-0%20(1).png";

        const death = new Image();

        death.src = "images/pixil-frame-0%20(77).png";

        const water = new Image();

        water.src = "images/pixil-frame-0%20(6).png";


        const yellowBouncyPad = new Image();

        yellowBouncyPad.src = "images/pixil-frame-0%20(79).png"

        const pinkBouncyPad = new Image();

        pinkBouncyPad.src = "images/pixil-frame-0%20(78).png"

        const redBouncyPad = new Image();

        redBouncyPad.src = "images/pixil-frame-0%20(80).png"

        const ball = new Image();

        ball.src = "images/guard.png"

        let sky = new Image();

        sky.src = "images/pixil-frame-0%20(3).png";

        let isCaveBackground = true

        const cannon = new Image();
        cannon.src = "images/pixil-frame-0%20(2).png";

        const playerLauncher = new Image();
        playerLauncher.src = "images/pixil-frame-0 (playerLauncher).png"

        const portalIMG = new Image();
        portalIMG.src = "images/pixil-frame-0-2.png";

        const deathSound = document.getElementById("deathSound");
        function playDeathSound() {
            deathSound.currentTime = 0;
            deathSound.play();
            player.image = playerImg
            player.type = "cube"
            basegravity = 0.73
            highScoreBoxX = highScore
        }

        const bounceSound = document.getElementById("bounceSound");
        function playBounceSound() {
            bounceSound.currentTime = 0;
            bounceSound.play();
        }

        const checkpointSound = document.getElementById("checkpointSound");
        function playCheckpointSound() {
            checkpointSound.currentTime = 0;
            checkpointSound.play();
        }

        const finishSound = document.getElementById("finishSound");
        function playFinishSound() {
            finishSound.currentTime = 0;
            finishSound.play();
        }
        let playedFinishSound = false;
        let hadSetTimeout = false;

        const bulletIMG = new Image();
        bulletIMG.src = "images/Screen Shot 2026-05-04 at 2.50.58 PM.png";

        function changeBackground() {
            if (isCaveBackground) {
                sky.src = "images/Screen%20Shot%202026-04-24%20at%2012.34.40%20PM.png";
                isCaveBackground = false
                document.querySelector('#background').innerText = 'Cave'
            }
            else {
                sky.src = "images/pixil-frame-0%20(3).png";
                isCaveBackground = true
                document.querySelector('#background').innerText = 'Sky'
            }
        }
        let portals = []


        const player = {
            x: 50,
            y: 310,
            width: 20,
            height: 20,
            dx: 0,
            dy: 0,
            speed: 7,
            jumpPower: -10.5,
            grounded: false,
            image: playerImg,
            type: "cube"
        };
        let scrollX = 0;
        scrollX = player.x - 400;
        let scrollY = 0;
        scrollY = player.y - 200;

        let platforms = [];
        let dangers = [];
        let enemys = [];
        let thickness = 20
        let currentX = 400;
        let deathNum = 0;
        let currentY = 300;
        let save = {
            x: 50,
            y: 310
        }
        let cooldown = false
        let dashCooldown = 0;
        let level = Number(localStorage.getItem("platLevel"));
        let printLevel = level;
        const DASH_DURATION = 1;

        function flipPlayerIMG() {
            playerImg.src = "images/flip.png"
        }

        function unflipPlayerIMG() {
            playerImg.src = "images/pixil-frame-0 (1).png"
        }

        let end = {
            x: 0,
            y: 0
        }
        let time = 0
        const levelsNum = 23
        setInterval(() => {
            time += 1
        }, 1000)




        function SpawnEnemy(px, py) {
            enemys.push({ x: px, y: py })
        }

        function addPlatform(
            px, py, w, h,
            danger = false,
            bouncy = false,
            flipSpike = false,
            isWater = false,
            checkpoint = false,
            flipBounce = false
        ) {
            let add = 0
            if (currentX < returnToNormalHeightX) add = increasedHeight
            if (bouncy) py += 10
            if (!danger) {
                platforms.push({
                    x: px,
                    y: py + add,
                    width: w,
                    height: h,
                    b: bouncy,
                    water: isWater,
                    check: checkpoint,
                    flipBounce: flipBounce
                });
            }
            else dangers.push({ x: px, y: py + add, width: w, height: h, isFlipped: flipSpike })
        }


        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        bullets = []

        setInterval(() => {
            for (const enemy of enemys) {
                bullets.push({ x: enemy.x, y: enemy.y })
            }
        }, 4000);
        function addPortal(cx, cy, type) {
            let add = 0
            if (currentX < returnToNormalHeightX) add = increasedHeight
            portals.push({ x: cx, y: cy + add, type: type })
        }
        let returnToNormalHeightX = 0
        let increasedHeight = -20

        addPlatform(0, 380, 80000, 20)
        addPlatform(0, 360, 80000, 20)
        addPlatform(0, 340, 80000, 20)
        let hasIncreasedLevel = false

        localStorage.setItem('geoLevel', localStorage.getItem('geoLevel') || '1')
        let geoLevel = Number(localStorage.getItem('geoLevel'))

        for (let i = 0; i < 250; i++) {
            let numOfLevels;
            if (geoLevel === 1) numOfLevels = 10
            if (geoLevel === 2) numOfLevels = 10
            if (geoLevel >= 3) numOfLevels = 13
            let roll = Math.ceil(Math.random() * (numOfLevels))
            //roll = 13
            let roll1 = Math.random()
            if (roll === 1) { // Single spike
                addPlatform(currentX, 320, 20, 20, true)
                if (roll1 < 0.3) {
                    addPlatform(currentX + 20, 320, 20, 20, true)
                }

                if (roll1 < 0.15 && geoLevel >= 2) {
                    addPlatform(currentX + 40, 320, 20, 20, true)
                }
                currentX += Math.random() * 140 + 150
            } else if (roll === 2) { // Platforms over lava
                const gap = 86
                addPlatform(currentX - 40, 320, 60, 20)
                addPlatform(currentX + gap, 300, 30, 20)
                addPlatform(currentX + gap * 2, 280, 30, 20)
                addPlatform(currentX + gap * 3, 260, 30, 20)
                addPlatform(currentX + gap * 4, 240, 30, 20)
                addPlatform(currentX + 20, 320, roll1 < 0.4 ? gap * 3 : gap * 4, 20, true)
                if (roll1 < 0.4) {
                    addPlatform(currentX + gap * 4 + 5, 200, 20, 40, true)
                    addPlatform(currentX + gap * 4 + 65, 320, 20, 20, true)
                    addPlatform(currentX + gap * 4 + 85, 320, 20, 20, true)
                }

                currentX += Math.random() * 140 + 500
            } else if (roll === 3) { //Twin towers
                addPlatform(currentX, 320, 20, 20)
                addPlatform(currentX, 300, 20, 20)
                addPlatform(currentX + 20, 320, 80, 20, true)
                addPlatform(currentX + 100, 320, 20, 20)
                addPlatform(currentX + 100, 300, 20, 20)
                currentX += Math.random() * 140 + 250

            } else if (roll === 4) { // Extended jump platform Spikes
                addPlatform(currentX, 320, 20, 20, true)
                addPlatform(currentX + 20, 300, 400, 20)
                addPlatform(currentX + 20, 340, 400, 20)
                addPlatform(currentX + 20, 320, 400, 20)
                addPlatform(currentX + 160, 280, 80, 20, true)
                if (roll1 < 0.8) addPlatform(currentX + 400, 280, 20, 20, true)
                if (roll1 < 0.5) addPlatform(currentX + 380, 280, 20, 20, true)
                if (roll1 < 0.1 && geoLevel >= 2) addPlatform(currentX + 360, 280, 20, 20, true)
                addPlatform(currentX + 180, 260, 40, 20)

                currentX += Math.random() * 140 + 500

            } else if (roll === 5) { //Extended jump platform Dip
                addPlatform(currentX, 300, 180, 20)
                addPlatform(currentX, 320, 400, 20)
                addPlatform(currentX, 340, 400, 20)
                addPlatform(currentX + 300, 300, 100, 20)
                addPlatform(currentX + 220, 280, 20, 20)
                addPlatform(currentX + 220, 240, 20, 40, true)
                let roll2 = Math.random()
                if (roll2 < 0.5) addPlatform(currentX + 160, 280, 20, 20, true)
                if (roll2 < 0.1 && geoLevel >= 2) addPlatform(currentX + 140, 280, 20, 20, true)

                if (roll1 < 0.8) addPlatform(currentX + 380, 280, 20, 20, true)
                if (roll1 < 0.5) addPlatform(currentX + 364, 280, 20, 20, true)
                if (roll1 < 0.1 && geoLevel >= 2) addPlatform(currentX + 348, 280, 20, 20, true)
                currentX += Math.random() * 140 + 500
            } else if (roll === 6) { //Heighten 1
                if (currentX < returnToNormalHeightX) continue
                addPlatform(currentX, 320, 1000, 20)
                returnToNormalHeightX = currentX + 1000
                currentX += 120
            } else if (roll === 7) { // Bounce to jump
                addPlatform(currentX, 320, 20, 20, false, true)
                addPlatform(currentX + 100, 310, 20, 10)
                addPlatform(currentX + 20, 320, 140, 20, true)
                currentX += 340
            } else if (roll === 8) { //Xstep
                addPlatform(currentX, 320, 120, 20)
                addPlatform(currentX + 80, 300, 20, 20, false, true)
                addPlatform(currentX + 100, 300, 20, 20, true)
                addPlatform(currentX + 120, 120, 20, 20)
                addPlatform(currentX + 120, 140, 20, 20)
                addPlatform(currentX + 120, 160, 20, 20)
                addPlatform(currentX + 120, 180, 20, 20)
                currentX += 300
            } else if (roll === 9) { //Overhang pass
                addPlatform(currentX, 320, 800, 20, true)
                addPlatform(currentX, 340, 800, 20)
                let currentY = 230
                let maxX = currentX + 800
                addPlatform(currentX - 40, 320, 20, 20, false, 2)
                let isFirst = true
                while (currentX < maxX) {

                    let width = Math.random() * 120 + 80
                    let roll4 = Math.random()
                    let isDoingXstep = Math.random() < 0.2 && currentY < 290
                    if (isDoingXstep) {
                        addPlatform(currentX, currentY, 120, 20)
                        addPlatform(currentX + 80, currentY - 20, 20, 20, false, 2)
                        addPlatform(currentX + 100, currentY - 20, 20, 20, true)
                        addPlatform(currentX + 120, currentY - 200, 20, 20)
                        addPlatform(currentX + 120, currentY - 180, 20, 20)
                        addPlatform(currentX + 120, currentY - 160, 20, 20)
                        addPlatform(currentX + 120, currentY - 140, 20, 20)
                        currentY += 40
                        width = 100
                        currentX -= 40
                    } else {

                        addPlatform(currentX, currentY, width, 20)
                        let roll2 = Math.random()
                        let roll3 = Math.random()
                        if (roll2 < 0.6 && width > 120 && !isFirst) {
                            addPlatform(currentX + width / 2 - 10, currentY - 20, 20, 20, true)
                        }
                        if (roll3 < 0.2) {
                            addPlatform(currentX + width - 17.5, currentY - 20, 20, 20, false, 2)
                        }
                    }
                    currentX += width + Math.random() * 40 + 30
                    currentY += Math.random() * 40 - 30
                    currentY = Math.min(currentY, 300)
                    isFirst = false

                }
                currentX += 80
            } else if (roll === 10) {
                currentX += 200
                let maxX = currentX + 840
                returnToNormalHeightX = currentX + 1000
                addPlatform(currentX, 300, 20, 20)
                addPlatform(currentX, 280, 20, 20)
                addPlatform(currentX, 260, 20, 20)
                addPlatform(currentX, 240, 20, 20)
                addPlatform(currentX, 220, 20, 20)
                addPlatform(currentX, 200, 20, 20)
                addPlatform(currentX + 1000, 300, 20, 20)
                addPlatform(currentX + 1000, 280, 20, 20)
                addPlatform(currentX + 1000, 260, 20, 20)
                addPlatform(currentX + 1000, 240, 20, 20)
                addPlatform(currentX + 1000, 220, 20, 20)
                addPlatform(currentX + 1000, 200, 20, 20)
                addPlatform(currentX, 200, 1000, 20)
                addPlatform(currentX - 200, 340, 1200, 20)
                addPortal(currentX, 320, "ball")
                addPortal(currentX + 1000, 320, "cube")

                currentX += 120
                let isOnFloor = true

                while (currentX < maxX) {
                    let roll5 = Math.random()
                    let roll6 = Math.random()
                    let length = (Math.ceil(Math.random() * 6)) * 20
                    if (roll6 > 0.8 && geoLevel >= 2) {
                        length += 60
                        addPlatform(currentX + length / 2 - 20, !isOnFloor ? 320 : 220, 20, 20, true, 0, isOnFloor)
                        addPlatform(currentX + length - 20, isOnFloor ? 300 : 240, 20, 20, true, 0, !isOnFloor)
                    }
                    if (Math.random() < 0.8 && roll6 < 0.8 && length <= 40 && geoLevel >= 2) {
                        currentX += 20
                        addPlatform(currentX - 20, isOnFloor ? 320 : 210, 20, 20, false, 1, false, false, false, !isOnFloor)
                        addPlatform(currentX, !isOnFloor ? 320 : 220, length, 20, roll6 < 0.8, false, isOnFloor)
                    }
                    addPlatform(currentX, isOnFloor ? 320 : 220, length, 20, roll6 < 0.8, false, !isOnFloor)
                    if (Math.random() < 0.8 && roll6 < 0.8 && length <= 40 && geoLevel >= 2) {
                        currentX += 60
                    }

                    currentX += (roll6 > 0.8) ? 20 : 0

                    currentX += length + Math.random() * 30 + 40
                    isOnFloor = !isOnFloor
                }
                currentX += 250
            } else if (roll === 11) {
                addPlatform(currentX, 320, 60, 20, true)
                addPlatform(currentX + 60, 320, 20, 20)
                addPlatform(currentX + 80, 320, 80, 20, true)
                addPlatform(currentX + 160, 320, 20, 20)
                if (roll1 > 0.3) {
                    addPlatform(currentX + 160, 300, 20, 20, false, 2)
                }
                addPlatform(currentX + 180, 320, roll1 > 0.3 ? 100 : 60, 20, true)
                currentX += 360
            } else if (roll === 12) {
                addPlatform(currentX, 320, 20, 20, false, 3)
                addPlatform(currentX + 60, 160, 180, 20)

                if (roll1 > 0.5) {
                    addPlatform(currentX + 220, 80, 20, 80, true)
                } else {
                    addPlatform(currentX + 80, 260, 20, 80, true)
                    addPlatform(currentX + 220, 100, 20, 60, true)
                }
                addPlatform(currentX + 80, 280, 20, 60, true)
                currentX += 380
            } else if (roll === 13) {
                let currentY = 140
                addPlatform(currentX, 120, 800, 20)
                addPlatform(currentX, 140, 800, 20, true, false, true)
                addPortal(currentX, 320, "gravUp")
                
                addPlatform(currentX + 40, 160, 80, 20)
                let maxX = currentX + 740
                while (currentX < maxX) {
                    let roll5 = Math.random() < 0.5
                    if ((roll5 || currentY <= 160) && currentY < 240) {
                        currentX += 76
                        currentY += 20
                    } else {
                        currentX += 60
                        currentY -= 20
                    }
                    addPlatform(currentX, currentY, 30, 20)

                }
                addPortal(currentX + 40, currentY + 20, "gravDown")
                currentX += 180
            }
        }
        let highScoreBoxX = -40
        let countFPS = 0
        setTimeout(() => {
            console.log(`FPS: ${countFPS / 10}`)
        }, 10000);
        let annouceBox = document.getElementById('announcement')
        annouceBox.style.display = 'block'
        annouceBox.innerText = `Current Level: ${geoLevel}`


        function update() {
            const goal = 11000
            let progressPercent = (player.x / goal) * 100;
            let maxProgress = (highScore / goal) * 100;
            document.getElementById("progressBar").style.width = `${progressPercent}%`;
            document.getElementById("progressBarMax").style.width = `${maxProgress}%`;
            if (player.x > goal && !hasIncreasedLevel) {
                localStorage.setItem("geoLevel", String(geoLevel + 1))
                let annouceBox = document.getElementById('announcement')
                annouceBox.style.display = 'block'
                annouceBox.innerText = `Level complete! Next level: ${geoLevel + 1}`
            }
            countFPS += 1
            const framesPerSecond = 65
            player.x += 10.4 / framesPerSecond * 20
            if (keys['KeyM']) {
                localStorage.setItem('geoLevel', '1')
            }
            if (keys['KeyL']) {
                localStorage.setItem('geoLevel', String(geoLevel + 1))
            }
            localStorage.setItem('Score', highScore);
            localStorage.setItem('Deaths', deathNum);
            localStorage.setItem('Time', time)

            highScore = Math.max(Math.round(player.x), highScore)
            document.querySelector("#cord").innerText = `x: ${Math.round(player.x)}, y: ${Math.round(player.y)}, Highest score: ${highScore}, Level: ${printLevel}, Deaths: ${deathNum}, Time: ${time}`
            let moveDir = 0;

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x -= 5;

                if (player.x < b.x + 10 && player.x + player.width > b.x && player.y < b.y + 10 && player.y + player.height > b.y) {
                    player.x = save.x;
                    player.y = save.y;
                    playDeathSound();
                    deathNum += 1
                    player.dy = 0;
                    bullets.splice(i, 1);
                    continue;
                }
                if (b.x > player.x + 1600) {
                    bullets.splice(i, 1);
                }
            }
            if (!isGameOver) {
                player.dy += gravity;
            } else {
                player.dy = 0;
                player.dx = 0;
            }

            if ((keys['ArrowUp'] || keys['Space'] || keys['KeyW']) && player.grounded) {
                if (player.type === "cube") {
                    if (gravity > 0) player.dy = player.jumpPower;
                    else player.dy = player.dy = -player.jumpPower / 1.3;
                    player.grounded = false;
                } else {
                    basegravity = -basegravity
                    player.y += basegravity
                    player.dy = basegravity * 5
                }
            }


            player.y += player.dy;

            player.grounded = false;
            gravity = basegravity


            for (let plat of platforms) {
                if (plat.x > player.x + 200) { continue; }
                if (player.x < plat.x + plat.width &&
                    player.x + player.width > plat.x &&
                    player.y < plat.y + plat.height &&
                    player.y + player.height > plat.y && !keys['ArrowDown']) {
                    if (plat.b) {
                        let force = -15
                        if (plat.b === 1) {
                            force = -11
                        }
                        if (plat.b === 3) {
                            force = -17
                        }
                        if (gravity > 0) {
                            if (true) {

                                player.dy = force;
                                playBounceSound();
                                continue;
                            }
                            continue;
                        }
                        player.dy = -force / 1.2;
                        playBounceSound();
                        continue;

                    }
                    if (!plat.water) { unflipPlayerIMG(); };
                    if (plat.water) { gravity = -basegravity / 2; flipPlayerIMG(); continue; };
                    if (plat.check) { printLevel += 1; plat.check = false; save.x = player.x + 10; save.y = player.y; playCheckpointSound(); if (Number(localStorage.getItem('platLevel')) < printLevel) localStorage.setItem('platLevel', String(printLevel)); revampLevels() };
                    if (gravity > 0) {

                        if (player.dy > 0 && player.y + player.height - player.dy <= plat.y + 5) {
                            player.y = plat.y - player.height;
                            player.dy = 0;
                            player.grounded = true;
                        }
                    } else {
                        if (player.dy < 0 && player.y - player.dy >= plat.y + plat.height - 5) {
                            player.y = plat.y + plat.height;
                            player.dy = 0;
                            player.grounded = true;
                        }
                    }

                }
            }
            for (let plat of platforms) {
                if (plat.x > player.x + 200) { continue; }
                if (player.x < plat.x + plat.width &&
                    player.x + player.width > plat.x &&
                    player.y < plat.y + plat.height &&
                    player.y + player.height > plat.y && !keys['ArrowDown'] && !plat.water && !plat.b && !plat.check) {
                    playDeathSound();

                    player.x = save.x;
                    player.y = save.y;
                    deathNum += 1
                    player.dy = 0;
                }

            }
            for (let portal of portals) {
                if (portal.x > player.x + 300) { continue; }
                if (player.x < portal.x + 40 &&
                    player.x + player.width > portal.x &&
                    player.y < portal.y + 40 &&
                    player.y + player.height > portal.y) {
                    if (portal.type === "ball") {
                        player.image = ball
                        player.type = "ball"
                    }
                    if (portal.type === "cube") {
                        player.image = playerImg
                        player.type = "cube"
                    }
                    if (portal.type === "gravUp") {
                        basegravity = -0.73
                        player.y -= 1
                    }
                    if (portal.type === "gravDown") {
                        basegravity = 0.73
                        player.y += 1
                    }
                }
            }

            for (let dang of dangers) {
                if (dang.x > player.x + 300) { continue; }
                const hitBoxDecrease = 4
                if (player.x < dang.x + dang.width - hitBoxDecrease &&
                    player.x + player.width > dang.x + hitBoxDecrease &&
                    player.y < dang.y + dang.height - hitBoxDecrease &&
                    player.y + player.height > dang.y + hitBoxDecrease) {

                    playDeathSound();

                    player.x = save.x;
                    player.y = save.y;
                    deathNum += 1
                    player.dy = 0;
                }
            }

            if (player.y > canvas.height) {
                player.x = save.x;
                player.y = save.y;
                deathNum += 1
                player.dy = 0;
            }
            scrollX = player.x - 200;
            scrollY = player.y - 0.5 * canvas.height;

        }

        function draw() {
            ctx.drawImage(sky, 0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(
                Math.min(0, -scrollX),
                Math.max(canvas.height - 400, -scrollY)
            );

            ctx.fillStyle = '#287271';
            nope = false;
            platforms.forEach(plat => {

                if (plat.b) {
                    for (let b = 0; b < plat.width; b += 20) {
                        let bouncyImage = yellowBouncyPad
                        if (plat.b === 1) bouncyImage = pinkBouncyPad
                        if (plat.b === 3) bouncyImage = redBouncyPad
                        if (plat.flipBounce) {
                            ctx.save();
                            ctx.translate(plat.x + b + 10, plat.y + 10);
                            ctx.scale(1, -1);
                            ctx.drawImage(bouncyImage, -10, -10, 20, plat.height);
                            ctx.restore();
                        } else {
                            ctx.drawImage(bouncyImage, plat.x + b, plat.y - 10, 20, plat.height);
                        }
                    }
                    nope = true;

                } else if (plat.water) {
                    for (let b = 0; b < plat.width; b += 20) {
                        for (let k = 0; k < plat.height; k += 160) {
                            ctx.drawImage(water, plat.x + b, plat.y + k, 20, 160);
                        }
                    }
                    nope = true;

                } else if (plat.check) {
                    ctx.fillStyle = '#87CEEB';
                    nope = false;

                } else {
                    nope = true;
                    if (plat.height > 60) {
                        nope = false;
                        ctx.fillStyle = '#6792e0';
                    }
                    for (let b = 0; b < plat.width; b += 10) {
                        if (nope) {
                            ctx.drawImage(brick, plat.x + b, plat.y, 10, plat.height);
                        }
                    }
                }
            });

            ctx.fillStyle = '#ffffff'
            ctx.fillRect(highScoreBoxX + 14, -500, 3, 1000)

            dangers.forEach(plat => {
                for (let b = 0; b < plat.width; b += 20) {

                    if (plat.isFlipped) {
                        ctx.save();
                        ctx.translate(plat.x + b + 10, plat.y + 10);
                        ctx.scale(1, -1);
                        ctx.drawImage(death, -10, -10, 20, 20);
                        ctx.restore();
                    } else {
                        ctx.drawImage(death, plat.x + b, plat.y, 20, plat.height);
                    }
                }
            });

            ctx.fillStyle = '#f4a261';
            enemys.forEach(enemy => {
                ctx.drawImage(cannon, enemy.x, enemy.y, 30, 30);
            });

            ctx.fillStyle = '#e76f51';
            bullets.forEach(bullet => {
                ctx.drawImage(bulletIMG, bullet.x, bullet.y, 10, 10);
            });

            portals.forEach(portal => {
                ctx.drawImage(portalIMG, portal.x - 20, portal.y - 20, 60, 60);
            });

            ctx.drawImage(player.image, player.x, player.y, player.width, player.height);

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);

        }

        loop();
    </script>
</body>
